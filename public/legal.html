<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#080b12">
    <title>Store Policies | DAVID MYALIK</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
    <style>
        .legal-page { min-height: 100vh; padding: 120px 24px 72px; }
        .legal-content { max-width: 820px; margin: 0 auto; }
        .legal-content h1 { font-size: clamp(40px, 8vw, 76px); line-height: 1; margin-bottom: 14px; }
        .legal-updated { color: var(--text-muted); font: 11px var(--font-mono); margin-bottom: 32px; }
        .legal-copy {
            min-height: 240px; padding: clamp(20px, 5vw, 40px); border: 1px solid var(--border);
            border-radius: 8px; background: var(--navy-card); color: var(--text-muted);
            font: 14px/1.9 var(--font-mono); white-space: pre-wrap; overflow-wrap: anywhere;
        }
        @media (max-width: 480px) { .legal-page { padding: 100px 16px 48px; } }
    </style>
</head>
<body>
    <div id="site-nav"></div>
    <main class="legal-page">
        <article class="legal-content">
            <h1 id="policy-title">STORE <span class="text-red">POLICY</span></h1>
            <p class="legal-updated">PLEASE REVIEW THE CURRENT STORE POLICY BELOW</p>
            <div class="legal-copy" id="policy-copy" aria-live="polite">Loading policy…</div>
            <p class="font-mono text-xs text-muted" style="margin-top:24px;">Questions? <a href="/contact" class="text-red">Contact us</a>.</p>
        </article>
    </main>
    <div id="site-footer"></div>
    <script src="/js/components.js"></script>
    <script>
        (async () => {
            let user = null;
            try { user = await checkAuth(); }
            catch (error) { console.error('Unable to load authentication state:', error); }
            renderNav(user);
            renderFooter();

            const isPrivacy = window.location.pathname === '/privacy-policy';
            const key = isPrivacy ? 'policy_privacy' : 'policy_terms';
            const title = isPrivacy ? 'PRIVACY POLICY' : 'TERMS OF SERVICE';
            document.title = `${title} | DAVID MYALIK`;
            document.getElementById('policy-title').innerHTML = isPrivacy
                ? 'PRIVACY <span class="text-red">POLICY</span>'
                : 'TERMS OF <span class="text-red">SERVICE</span>';

            const content = document.getElementById('policy-copy');
            try {
                const response = await fetch('/api/settings/all');
                if (!response.ok) throw new Error('Policy settings are unavailable.');
                const settings = await response.json();
                content.textContent = settings[key] || 'This policy is being prepared. Please contact us before placing an order if you have questions.';
            } catch (error) {
                console.error('Unable to load store policy:', error);
                content.textContent = 'This policy is temporarily unavailable. Please contact us with any questions.';
            }
        })();
    </script>
</body>
</html>
